name: agent-handshake-cli-release

on:
  push:
    tags: ["v2.1.0"]

permissions:
  contents: write
  id-token: write
  attestations: write

env:
  NODE_VERSION: 24.18.0

jobs:
  build-portable:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
      - run: npm ci
      - name: Build and execute the audited portable helper
        shell: bash
        run: |
          mkdir -p dist
          node scripts/build-agent-handshake-release.mjs bundle dist/clockchain-agent-handshake.cjs
          node dist/clockchain-agent-handshake.cjs --version
          node dist/clockchain-agent-handshake.cjs init --state-dir "$RUNNER_TEMP/clockchain-agent-state" > dist/node-any.public.json
          node scripts/build-agent-handshake-release.mjs record dist/clockchain-agent-handshake.cjs node any node24_portable dist/node-any.public.json dist/node-any.record.json
      - uses: actions/attest-build-provenance@v2
        with:
          subject-path: dist/clockchain-agent-handshake.cjs
      - uses: actions/upload-artifact@v4
        with:
          name: agent-handshake-node-any
          path: |
            dist/clockchain-agent-handshake.cjs
            dist/*.record.json

  publish:
    needs: build-portable
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 24.18.0 }
      - uses: actions/download-artifact@v4
        with: { path: dist, merge-multiple: true }
      - run: node scripts/verify-agent-handshake-release.mjs assemble dist "$GITHUB_SHA" 24.18.0 dist/manifest.json
      - env: { GH_TOKEN: "${{ github.token }}" }
        run: gh release create v2.1.0 dist/clockchain-agent-handshake.cjs dist/manifest.json --verify-tag --title "Clockchain Agent Handshake 2.1.0"
