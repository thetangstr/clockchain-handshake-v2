name: local-adapter-npm-publish

# Publishes @d4d.group/local-adapter to npm with provenance.
# Trigger: tag `local-adapter-vX.Y.Z` where X.Y.Z MUST equal the adapter's own
# package version (LOCAL_ADAPTER_VERSION in src/agent-handshake/v2/constants.mjs).
# The adapter's semver floats independently of the vendored helper release
# (release/agent-handshake/pin.json), which stays pinned at
# AGENT_HANDSHAKE_HELPER_VERSION. Manual dispatch defaults to a dry run.
#
# Dist-tags: no publish here ever moves `latest`.
#   - A tag push publishes under `next`.
#   - A manual dispatch publishes under its `dist_tag` input (default `next`);
#     `latest` is refused there.
#   - `latest` moves only through a separate dispatch with the
#     `set_latest_version` input (an exact X.Y.Z that npm already serves). That
#     dispatch publishes nothing; it runs
#       npm dist-tag add @d4d.group/local-adapter@<version> latest
#     To promote a release, dispatch with its version. To roll back, dispatch
#     with the previous version. The same command run by hand is equivalent.
#
# Auth: npm Trusted Publishing (OIDC) — no long-lived npm token in CI. The
# package must have github.com/thetangstr/clockchain-handshake-v2 registered as
# a trusted publisher for THIS workflow file. If trusted publishing is not yet
# configured, set the NODE_AUTH_TOKEN repository secret as the fallback — the
# publish step reads secrets.NODE_AUTH_TOKEN. Trusted publishing covers
# `npm publish` only, so moving `latest` always uses NODE_AUTH_TOKEN.

on:
  push:
    tags: ["local-adapter-v*"]
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Dry run: publish with --dry-run, or only report when moving latest"
        type: boolean
        default: true
      dist_tag:
        description: "npm dist-tag to publish under (never latest; use set_latest_version)"
        type: string
        default: next
      set_latest_version:
        description: "Only move the latest dist-tag to this published X.Y.Z; publishes nothing"
        type: string
        default: ""

permissions:
  contents: read
  id-token: write # required for npm --provenance / trusted publishing

env:
  NODE_VERSION: 24.18.0
  PKG_DIR: dist/npm-local-adapter

jobs:
  pack-and-verify:
    if: github.event_name == 'push' || inputs.set_latest_version == ''
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          registry-url: https://registry.npmjs.org
      - run: npm ci

      - name: Run adapter unit tests
        run: node --test test/local-adapter.test.mjs

      - name: Build the adapter package (downloads + verifies pinned release assets)
        run: node scripts/build-local-adapter-npm.mjs

      - name: Assert versions (tag == adapter package; vendored pin == helper release)
        shell: bash
        run: |
          PKG_VERSION=$(node -p "require('./$PKG_DIR/package.json').version")
          PIN_VERSION=$(node -p "require('./$PKG_DIR/assets/pin.json').version")
          HELPER_VERSION=$(node --input-type=module -e 'import { AGENT_HANDSHAKE_HELPER_VERSION } from "./src/agent-handshake/v2/constants.mjs"; console.log(AGENT_HANDSHAKE_HELPER_VERSION)')
          ADAPTER_VERSION=$(node --input-type=module -e 'import { LOCAL_ADAPTER_VERSION } from "./src/agent-handshake/v2/constants.mjs"; console.log(LOCAL_ADAPTER_VERSION)')
          if [ "$PKG_VERSION" != "$ADAPTER_VERSION" ]; then
            echo "package version $PKG_VERSION != LOCAL_ADAPTER_VERSION $ADAPTER_VERSION"; exit 1
          fi
          if [ "$PIN_VERSION" != "$HELPER_VERSION" ]; then
            echo "vendored pin $PIN_VERSION != helper release $HELPER_VERSION"; exit 1
          fi
          if [ "${{ github.event_name }}" = "push" ]; then
            TAG_VERSION="${GITHUB_REF_NAME#local-adapter-v}"
            if [ "$TAG_VERSION" != "$PKG_VERSION" ]; then
              echo "tag $GITHUB_REF_NAME does not match package version $PKG_VERSION"; exit 1
            fi
          fi
          echo "versions OK: adapter $PKG_VERSION carrying helper $PIN_VERSION"

      - name: npm pack
        working-directory: ${{ env.PKG_DIR }}
        run: npm pack

      - name: Clean-directory install smoke test
        shell: bash
        run: |
          SMOKE="$RUNNER_TEMP/adapter-install-smoke"
          mkdir -p "$SMOKE"
          cd "$SMOKE"
          npm init -y >/dev/null
          npm install "$GITHUB_WORKSPACE/$PKG_DIR"/*.tgz
          printf '%s\n%s\n' \
            '{"jsonrpc":"2.0","id":1,"method":"initialize","params":{"protocolVersion":"2025-03-26","capabilities":{},"clientInfo":{"name":"ci-smoke","version":"0"}}}' \
            '{"jsonrpc":"2.0","id":2,"method":"tools/list","params":{}}' \
            | node node_modules/@d4d.group/local-adapter/index.mjs \
            | node -e 'let b="";process.stdin.on("data",d=>b+=d).on("end",()=>{const msgs=b.split("\n").filter(Boolean).map(JSON.parse);const init=msgs.find(m=>m.id===1);const tools=msgs.find(m=>m.id===2);if(init?.result?.serverInfo?.name!=="clockchain-local-adapter")process.exit(1);if(!tools?.result?.tools?.some(t=>t.name==="authorize_local_action"))process.exit(1);console.log("smoke OK:",init.result.serverInfo.version)})'

      - uses: actions/upload-artifact@v4
        with:
          name: clockchain-local-adapter-${{ env.PKG_DIR && 'pkg' }}
          path: ${{ env.PKG_DIR }}/*.tgz
          retention-days: 14

  publish:
    runs-on: ubuntu-24.04
    needs: pack-and-verify
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          registry-url: https://registry.npmjs.org
      - run: npm ci
      - run: node scripts/build-local-adapter-npm.mjs

      # npm >= 11.5.1 for OIDC trusted publishing; setup-node ships a recent npm.
      # Dry run when dispatched with dry_run=true.
      - name: Publish with provenance under an explicit dist-tag
        working-directory: ${{ env.PKG_DIR }}
        shell: bash
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NODE_AUTH_TOKEN }} # fallback only; unused under trusted publishing
          DIST_TAG_INPUT: ${{ inputs.dist_tag }}
          DRY_RUN: ${{ inputs.dry_run }}
        run: |
          # npm publish without --tag moves latest, so every publish names its
          # tag: next for a tag push, the dist_tag input for a dispatch.
          if [ "$GITHUB_EVENT_NAME" = "push" ]; then
            DIST_TAG=next
          else
            DIST_TAG="$DIST_TAG_INPUT"
          fi
          if [ "$DIST_TAG" = "latest" ]; then
            echo "latest is moved only by the set_latest_version input"
            exit 1
          fi
          if ! [[ "$DIST_TAG" =~ ^[a-z][a-z0-9-]{0,31}$ ]]; then
            echo "dist_tag must be a lowercase npm dist-tag name"
            exit 1
          fi
          if [ "$DRY_RUN" = "true" ]; then
            npm publish --provenance --access public --tag "$DIST_TAG" --dry-run
          else
            npm publish --provenance --access public --tag "$DIST_TAG"
          fi

  set-latest:
    if: github.event_name == 'workflow_dispatch' && inputs.set_latest_version != ''
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          registry-url: https://registry.npmjs.org

      - name: Move the latest dist-tag to the named version
        shell: bash
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NODE_AUTH_TOKEN }}
          LATEST_VERSION: ${{ inputs.set_latest_version }}
          DRY_RUN: ${{ inputs.dry_run }}
        run: |
          # The only step that sets latest, and only to an exact version that
          # npm already serves.
          if ! [[ "$LATEST_VERSION" =~ ^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]; then
            echo "set_latest_version must be an exact X.Y.Z version"
            exit 1
          fi
          PACKAGE="@d4d.group/local-adapter"
          PUBLISHED=$(npm view "$PACKAGE@$LATEST_VERSION" version)
          if [ "$PUBLISHED" != "$LATEST_VERSION" ]; then
            echo "$PACKAGE@$LATEST_VERSION is not published"
            exit 1
          fi
          npm dist-tag ls "$PACKAGE"
          if [ "$DRY_RUN" = "true" ]; then
            echo "dry run: latest would move to $LATEST_VERSION"
            exit 0
          fi
          npm dist-tag add "$PACKAGE@$LATEST_VERSION" latest
          npm dist-tag ls "$PACKAGE"
