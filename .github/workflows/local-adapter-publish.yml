name: local-adapter-npm-publish

# Publishes @d4d.group/local-adapter to npm with provenance.
# Trigger: tag `local-adapter-vX.Y.Z` where X.Y.Z MUST equal the adapter's own
# package version (LOCAL_ADAPTER_VERSION in src/agent-handshake/v2/constants.mjs).
# The adapter's semver floats independently of the vendored helper release
# (release/agent-handshake/pin.json), which stays pinned at
# AGENT_HANDSHAKE_HELPER_VERSION.
#
# Real publishes happen ONLY on a push of a `local-adapter-v*` tag (and never
# when dry_run is true). Every other run — any workflow_dispatch, from any ref,
# whatever its inputs — ends in `npm publish --dry-run` inside pack-and-verify,
# with no OIDC token and no publish environment.
#
# The publish job publishes the exact .tgz that pack-and-verify built, tested
# and smoke-tested (downloaded as an artifact, sha256 bound through a job
# output), after re-checking the vendored helper sha256 and manifest digest
# inside it. It runs in the `npm-publish` GitHub environment, which must exist
# with protection rules (required reviewer; deployment tags limited to
# `local-adapter-v*`), and npm's trusted-publisher config for this package must
# name this workflow file and that environment.
#
# Auth: npm Trusted Publishing (OIDC) — no long-lived npm token in CI. If
# trusted publishing is not yet configured, set NODE_AUTH_TOKEN as an
# `npm-publish` environment secret as the fallback.

on:
  push:
    tags: ["local-adapter-v*"]
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Dispatched runs always dry-run; real publishes come only from tag pushes"
        type: boolean
        default: true

permissions:
  contents: read

env:
  NODE_VERSION: 24.18.0
  PKG_DIR: dist/npm-local-adapter
  # Vendored helper 2.1.8 (release/agent-handshake/pin.json).
  HELPER_SHA256: 7af676c41285b0bf0deeb600f9ae88f77768955303c3da7f2c3cc25406588f70
  MANIFEST_DIGEST: 956c8d94d4e7dbbaad5247e8de3f958ad75ec81831193c31c995e3787bf33bf7

jobs:
  pack-and-verify:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    outputs:
      tgz_name: ${{ steps.pack.outputs.tgz_name }}
      tgz_sha256: ${{ steps.pack.outputs.tgz_sha256 }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
      # No dependency install scripts run. esbuild's JS API resolves its native
      # binary from the @esbuild/linux-x64 optional dependency, so it does not
      # need esbuild's postinstall.
      - run: npm ci --ignore-scripts

      - name: Run adapter tests
        run: >-
          node --test --test-concurrency=4
          test/local-adapter.test.mjs
          test/local-adapter-contract-bind.test.mjs
          test/local-adapter-contract-bind-server.test.mjs
          test/local-adapter-fill-from-local.test.mjs
          test/local-adapter-invitation-guard.test.mjs
          test/local-adapter-invitation-refs.test.mjs
          test/test-only-never-ship.test.mjs

      - name: Build the adapter package (downloads + verifies pinned release assets)
        run: node scripts/build-local-adapter-npm.mjs

      - name: Assert versions (tag == adapter package; vendored pin == helper release)
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
        run: |
          PKG_VERSION=$(node -p "require('./$PKG_DIR/package.json').version")
          PIN_VERSION=$(node -p "require('./$PKG_DIR/assets/pin.json').version")
          HELPER_VERSION=$(node --input-type=module -e 'import { AGENT_HANDSHAKE_HELPER_VERSION } from "./src/agent-handshake/v2/constants.mjs"; console.log(AGENT_HANDSHAKE_HELPER_VERSION)')
          ADAPTER_VERSION=$(node --input-type=module -e 'import { LOCAL_ADAPTER_VERSION } from "./src/agent-handshake/v2/constants.mjs"; console.log(LOCAL_ADAPTER_VERSION)')
          if [ "$PKG_VERSION" != "$ADAPTER_VERSION" ]; then
            echo "package version $PKG_VERSION != LOCAL_ADAPTER_VERSION $ADAPTER_VERSION"; exit 1
          fi
          if [ "$PIN_VERSION" != "$HELPER_VERSION" ]; then
            echo "vendored pin $PIN_VERSION != helper release $HELPER_VERSION"; exit 1
          fi
          if [ "$EVENT_NAME" = "push" ]; then
            TAG_VERSION="${GITHUB_REF_NAME#local-adapter-v}"
            if [ "$TAG_VERSION" != "$PKG_VERSION" ]; then
              echo "tag $GITHUB_REF_NAME does not match package version $PKG_VERSION"; exit 1
            fi
          fi
          echo "versions OK: adapter $PKG_VERSION carrying helper $PIN_VERSION"

      - name: npm pack
        id: pack
        shell: bash
        run: |
          set -euo pipefail
          OUT="$RUNNER_TEMP/pkg"
          mkdir -p "$OUT"
          (cd "$PKG_DIR" && npm pack --ignore-scripts --pack-destination "$OUT")
          shopt -s nullglob
          TGZS=("$OUT"/*.tgz)
          if [ "${#TGZS[@]}" -ne 1 ]; then echo "expected exactly one tarball"; exit 1; fi
          TGZ="${TGZS[0]}"
          echo "tgz_name=$(basename "$TGZ")" >> "$GITHUB_OUTPUT"
          echo "tgz_sha256=$(sha256sum "$TGZ" | cut -d' ' -f1)" >> "$GITHUB_OUTPUT"
          echo "TGZ=$TGZ" >> "$GITHUB_ENV"

      - name: Verify the helper and manifest inside the tarball
        shell: bash
        run: |
          set -euo pipefail
          X="$RUNNER_TEMP/tgz-check"
          rm -rf "$X"; mkdir -p "$X"
          tar -xzf "$TGZ" -C "$X"
          echo "$HELPER_SHA256  $X/package/assets/clockchain-agent-handshake.cjs" | sha256sum -c -
          echo "$MANIFEST_DIGEST  $X/package/assets/manifest.json" | sha256sum -c -
          test "$(node -p "require('$X/package/assets/pin.json').manifestDigest")" = "$MANIFEST_DIGEST"
          node scripts/verify-agent-handshake-release.mjs --pin release/agent-handshake/pin.json \
            --manifest "$X/package/assets/manifest.json" --helper "$X/package/assets/clockchain-agent-handshake.cjs"

      # Clean-directory install of the packed tarball, served over stdio
      # against a loopback fake HTTPS coordinator — no production contact.
      - name: Clean-directory install smoke test (loopback fake coordinator)
        run: node scripts/smoke-local-adapter-package.mjs "$TGZ" --port 19431

      - uses: actions/upload-artifact@v4
        with:
          name: local-adapter-tgz
          path: ${{ runner.temp }}/pkg/*.tgz
          if-no-files-found: error
          retention-days: 14

      - name: Dry-run publish (every run that is not a tag push)
        if: ${{ !(github.event_name == 'push' && startsWith(github.ref, 'refs/tags/local-adapter-v')) || inputs.dry_run == true }}
        run: npm publish "$TGZ" --access public --dry-run --ignore-scripts

  publish:
    # Real publish: a tag push only, never a dispatch, never with dry_run.
    if: ${{ github.event_name == 'push' && startsWith(github.ref, 'refs/tags/local-adapter-v') && inputs.dry_run != true }}
    runs-on: ubuntu-24.04
    needs: pack-and-verify
    environment: npm-publish
    permissions:
      contents: read
      id-token: write # npm --provenance / trusted publishing; this job only
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          registry-url: https://registry.npmjs.org

      - uses: actions/download-artifact@v4
        with:
          name: local-adapter-tgz
          path: ${{ runner.temp }}/pkg

      - name: Re-verify the tested tarball before publishing
        shell: bash
        env:
          TGZ_NAME: ${{ needs.pack-and-verify.outputs.tgz_name }}
          TGZ_SHA256: ${{ needs.pack-and-verify.outputs.tgz_sha256 }}
        run: |
          set -euo pipefail
          shopt -s nullglob
          TGZS=("$RUNNER_TEMP"/pkg/*.tgz)
          if [ "${#TGZS[@]}" -ne 1 ]; then echo "expected exactly one tarball"; exit 1; fi
          TGZ="${TGZS[0]}"
          test "$(basename "$TGZ")" = "$TGZ_NAME"
          echo "$TGZ_SHA256  $TGZ" | sha256sum -c -
          X="$RUNNER_TEMP/tgz-check"
          rm -rf "$X"; mkdir -p "$X"
          tar -xzf "$TGZ" -C "$X"
          echo "$HELPER_SHA256  $X/package/assets/clockchain-agent-handshake.cjs" | sha256sum -c -
          echo "$MANIFEST_DIGEST  $X/package/assets/manifest.json" | sha256sum -c -
          test "$(node -p "require('$X/package/assets/pin.json').manifestDigest")" = "$MANIFEST_DIGEST"
          test "$(node -p "require('$X/package/package.json').name")" = "@d4d.group/local-adapter"
          test "$(node -p "require('$X/package/package.json').version")" = "${GITHUB_REF_NAME#local-adapter-v}"
          echo "TGZ=$TGZ" >> "$GITHUB_ENV"

      # npm >= 11.5.1 for OIDC trusted publishing; setup-node ships a recent npm.
      - name: Publish the tested tarball with provenance
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NODE_AUTH_TOKEN }} # fallback only; unused under trusted publishing
        run: npm publish "$TGZ" --provenance --access public --ignore-scripts
