<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Clockchain — bilateral payment authorization</title>
<style>
  :root {
    --bg: #0b0e14;
    --panel: #12161f;
    --panel2: #171c27;
    --line: #232a38;
    --text: #d6dde8;
    --dim: #7d8899;
    --accent: #6ee7b7;
    --amber: #fbbf24;
    --red: #f87171;
    --blue: #7dd3fc;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font: 14px/1.5 ui-monospace, SFMono-Regular, Menlo, monospace;
  }
  header {
    display: flex;
    align-items: baseline;
    gap: 14px;
    padding: 18px 22px;
    border-bottom: 1px solid var(--line);
  }
  h1 { font-size: 16px; font-weight: 600; margin: 0; }
  .badge {
    color: var(--accent);
    border: 1px solid var(--accent);
    border-radius: 4px;
    padding: 2px 8px;
    font-size: 11px;
  }
  .controls {
    display: flex;
    flex-wrap: wrap;
    align-items: end;
    gap: 14px;
    padding: 14px 22px;
    border-bottom: 1px solid var(--line);
    background: var(--panel);
  }
  label { display: block; color: var(--dim); font-size: 11px; margin-bottom: 4px; }
  input, select {
    background: var(--panel2);
    border: 1px solid var(--line);
    border-radius: 5px;
    color: var(--text);
    font: inherit;
    padding: 6px 9px;
    width: 150px;
  }
  select { width: auto; }
  button {
    background: var(--accent);
    border: 0;
    border-radius: 5px;
    color: #06251a;
    cursor: pointer;
    font: 600 13px/1 inherit;
    padding: 9px 18px;
  }
  button:disabled, input:disabled { opacity: 0.45; cursor: default; }
  button.stop { background: var(--red); color: #2b0606; }
  main {
    display: grid;
    gap: 14px;
    grid-template-columns: 1.4fr 1fr;
    padding: 16px 22px 28px;
  }
  .panel {
    background: var(--panel);
    border: 1px solid var(--line);
    border-radius: 8px;
    min-height: 120px;
    padding: 12px 14px;
  }
  .panel h2 {
    color: var(--dim);
    font-size: 11px;
    font-weight: 600;
    letter-spacing: 0.12em;
    margin: 0 0 10px;
    text-transform: uppercase;
  }
  #timeline { grid-row: span 2; }
  .stage {
    border-left: 2px solid var(--line);
    padding: 5px 0 5px 12px;
    position: relative;
  }
  .stage::before {
    background: var(--line);
    border-radius: 50%;
    content: "";
    height: 7px;
    left: -4.5px;
    position: absolute;
    top: 11px;
    width: 7px;
  }
  .stage.latest { border-left-color: var(--blue); }
  .stage.latest::before { background: var(--blue); box-shadow: 0 0 8px var(--blue); }
  .stage .name { color: var(--blue); font-size: 11px; letter-spacing: 0.08em; }
  .stage .msg { color: var(--text); }
  .stage .extra { color: var(--dim); font-size: 12px; }
  .decision {
    border-radius: 6px;
    font-weight: 700;
    margin-top: 8px;
    padding: 8px 10px;
  }
  .decision.accept { background: rgba(110,231,183,.12); color: var(--accent); }
  .decision.decline { background: rgba(248,113,113,.12); color: var(--red); }
  .reason { color: var(--dim); margin-top: 6px; }
  .agentline { color: var(--amber); margin-top: 4px; }
  .transitions { display: flex; flex-direction: column; gap: 8px; }
  .tx {
    background: var(--panel2);
    border: 1px solid var(--line);
    border-radius: 6px;
    display: flex;
    justify-content: space-between;
    padding: 8px 10px;
  }
  .tx .kind { color: var(--text); font-weight: 600; }
  .tx .meta { color: var(--dim); font-size: 12px; text-align: right; }
  #verdictBox {
    align-items: center;
    display: flex;
    flex-direction: column;
    justify-content: center;
    min-height: 140px;
    text-align: center;
  }
  .outcome { font-size: 26px; font-weight: 800; letter-spacing: 0.06em; }
  .outcome.ok { color: var(--accent); }
  .outcome.bad { color: var(--red); }
  .outcome.idle { color: var(--dim); font-size: 15px; }
  .sub { color: var(--dim); margin-top: 8px; }
  .pending { color: var(--dim); font-style: italic; }
  .hidden { display: none; }
</style>
</head>
<body>
<header>
  <h1>Clockchain — bilateral payment authorization</h1>
  <span class="badge">paymentMoved: false</span>
</header>

<div class="controls">
  <div>
    <label for="amount">USD amount</label>
    <input id="amount" value="100" inputmode="numeric">
  </div>
  <div>
    <label for="mode">Ledger</label>
    <select id="mode">
      <option value="stub" selected>stub (offline, deterministic)</option>
      <option value="live">live (Clockchain + Sepolia)</option>
    </select>
  </div>
  <div>
    <label for="agent">Provider decision</label>
    <select id="agent">
      <option value="1" selected>live agent decides</option>
      <option value="0">auto-accept</option>
    </select>
  </div>
  <div>
    <label for="model">Agent model</label>
    <input id="model" value="glm-5.3-flash">
  </div>
  <div id="liveConfirmWrap" class="hidden">
    <label for="liveConfirm">Live confirmation</label>
    <input id="liveConfirm" disabled>
  </div>
  <button id="run">Run handshake</button>
  <button id="stop" class="stop" disabled>Stop</button>
</div>

<main>
  <section class="panel" id="timeline">
    <h2>Timeline</h2>
    <div id="stages"><div class="pending">No run yet. Press Run handshake.</div></div>
  </section>

  <section class="panel" id="agentPanel">
    <h2>Provider agent decision</h2>
    <div id="agentBox"><div class="pending">Waiting for a proposal.</div></div>
  </section>

  <section class="panel">
    <h2>Anchored transitions</h2>
    <div class="transitions" id="txs"><div class="pending">Nothing anchored yet.</div></div>
  </section>

  <section class="panel" id="verdictBox">
    <div class="outcome idle" id="outcome">—</div>
    <div class="sub" id="sub">The independent verifier re-checks all evidence from scratch.</div>
  </section>
</main>

<script>
const nonce = document.querySelector('meta[name="handshake-demo-nonce"]')?.content || "";
const stages = document.getElementById("stages");
const agentBox = document.getElementById("agentBox");
const txs = document.getElementById("txs");
const outcome = document.getElementById("outcome");
const sub = document.getElementById("sub");
const runBtn = document.getElementById("run");
const stopBtn = document.getElementById("stop");
const modeInput = document.getElementById("mode");
const amountInput = document.getElementById("amount");
const liveConfirmWrap = document.getElementById("liveConfirmWrap");
const liveConfirm = document.getElementById("liveConfirm");
let es = null;
let runId = null;

function reset() {
  stages.replaceChildren();
  const stagePending = document.createElement("div");
  stagePending.className = "pending";
  stagePending.textContent = "Starting.";
  stages.appendChild(stagePending);
  agentBox.replaceChildren();
  const agentPending = document.createElement("div");
  agentPending.className = "pending";
  agentPending.textContent = "Waiting for a proposal.";
  agentBox.appendChild(agentPending);
  txs.replaceChildren();
  const txPending = document.createElement("div");
  txPending.className = "pending";
  txPending.textContent = "Nothing anchored yet.";
  txs.appendChild(txPending);
  outcome.className = "outcome idle";
  outcome.textContent = "—";
  sub.textContent = "The independent verifier re-checks all evidence from scratch.";
}

function addStage(d) {
  for (const el of stages.querySelectorAll(".stage")) el.classList.remove("latest");
  stages.querySelector(".pending")?.remove();
  const div = document.createElement("div");
  div.className = "stage latest";
  const name = document.createElement("div");
  name.className = "name";
  name.textContent = d.stage || "status";
  const msg = document.createElement("div");
  msg.className = "msg";
  msg.textContent = d.message || "";
  div.append(name, msg);
  const extras = Object.entries(d)
    .filter(([k]) => !["stage", "message", "paymentMoved"].includes(k))
    .map(([k, v]) => `${k}: ${v}`)
    .join("   ");
  if (extras) {
    const extra = document.createElement("div");
    extra.className = "extra";
    extra.textContent = extras;
    div.appendChild(extra);
  }
  stages.appendChild(div);
  div.scrollIntoView({ block: "nearest" });
}

function addLog(line) {
  stages.querySelector(".pending")?.remove();
  const div = document.createElement("div");
  div.className = "stage";
  const msg = document.createElement("div");
  msg.className = "msg extra";
  msg.textContent = line;
  div.appendChild(msg);
  stages.appendChild(div);
}

function addAgentLine(line) {
  agentBox.querySelector(".pending")?.remove();
  const div = document.createElement("div");
  div.className = "agentline";
  div.textContent = line;
  agentBox.appendChild(div);
  const match = /decided (ACCEPT|DECLINE) - (.*)$/.exec(line);
  if (match) {
    const chip = document.createElement("div");
    chip.className = "decision " + (match[1] === "ACCEPT" ? "accept" : "decline");
    chip.textContent = match[1];
    const why = document.createElement("div");
    why.className = "reason";
    why.textContent = match[2];
    agentBox.append(chip, why);
  }
}

function addTransition(t) {
  txs.querySelector(".pending")?.remove();
  const div = document.createElement("div");
  div.className = "tx";
  const kind = document.createElement("span");
  kind.className = "kind";
  kind.textContent = t.kind;
  const meta = document.createElement("span");
  meta.className = "meta";
  meta.append("block ", document.createElement("b"), document.createElement("br"), "ledger ", document.createElement("b"));
  const bolds = meta.querySelectorAll("b");
  bolds[0].textContent = t.block;
  bolds[1].textContent = t.ledger;
  div.append(kind, meta);
  txs.appendChild(div);
}

function setVerdict(value) {
  outcome.className = "outcome " + (value === "AUTHORIZED" ? "ok" : "bad");
  outcome.textContent = value;
}

function setRunning(running) {
  runBtn.disabled = running;
  stopBtn.disabled = !running || !runId;
}

function updateLiveControl() {
  const live = modeInput.value === "live";
  liveConfirmWrap.classList.toggle("hidden", !live);
  liveConfirm.disabled = !live;
  liveConfirm.placeholder = live ? `RUN LIVE USD ${amountInput.value.trim() || "100"}` : "";
  if (!live) liveConfirm.value = "";
}

async function api(path, options = {}) {
  const response = await fetch(path, {
    ...options,
    headers: {
      "content-type": "application/json",
      "x-handshake-demo-nonce": nonce,
      ...(options.headers || {}),
    },
  });
  const text = await response.text();
  const body = text ? JSON.parse(text) : null;
  if (!response.ok) {
    throw new Error(body?.error?.message || "Request failed.");
  }
  return body;
}

function subscribe(path) {
  es = new EventSource(path);
  es.addEventListener("started", (e) => {
    const d = JSON.parse(e.data);
    addLog("run-local-demo.mjs " + d.args.join(" ") + (d.live ? " (live)" : " (stub)"));
  });
  es.addEventListener("stage", (e) => addStage(JSON.parse(e.data)));
  es.addEventListener("status", (e) => {
    const d = JSON.parse(e.data);
    if (d.reason) sub.textContent = "Stopped: " + d.reason;
  });
  es.addEventListener("log", (e) => addLog(JSON.parse(e.data).line));
  es.addEventListener("agent", (e) => addAgentLine(JSON.parse(e.data).line));
  es.addEventListener("transition", (e) => addTransition(JSON.parse(e.data)));
  es.addEventListener("verdict", (e) => setVerdict(JSON.parse(e.data).outcome));
  es.addEventListener("nomove", (e) => {
    sub.textContent = "No money moved: " + JSON.parse(e.data).value;
  });
  es.addEventListener("cancelled", () => {
    outcome.className = "outcome bad";
    outcome.textContent = "CANCELLED";
    sub.textContent = "Run cancelled.";
    setRunning(false);
    es?.close();
    es = null;
    runId = null;
  });
  es.addEventListener("exit", (e) => {
    const { code } = JSON.parse(e.data);
    if (code !== 0 && outcome.textContent === "—") {
      outcome.className = "outcome bad";
      outcome.textContent = "FAILED CLOSED";
    }
    setRunning(false);
    es?.close();
    es = null;
    runId = null;
  });
  es.onerror = () => {
    es?.close();
    es = null;
    setRunning(false);
    if (outcome.textContent === "—") sub.textContent = "Connection lost before the run finished.";
  };
}

runBtn.onclick = async () => {
  es?.close();
  reset();
  setRunning(true);
  try {
    const amount = amountInput.value.trim() || "100";
    const body = {
      agent: document.getElementById("agent").value === "1",
      amount,
      mode: modeInput.value,
      model: document.getElementById("model").value.trim() || "glm-5.3-flash",
    };
    if (body.mode === "live") body.liveConfirmation = liveConfirm.value;
    const created = await api("/runs", { method: "POST", body: JSON.stringify(body) });
    runId = created.runId;
    subscribe(created.events);
    setRunning(true);
  } catch (error) {
    sub.textContent = error.message;
    outcome.className = "outcome bad";
    outcome.textContent = "INVALID INPUT";
    runId = null;
    setRunning(false);
  }
};

stopBtn.onclick = async () => {
  if (!runId) return;
  try {
    await api(`/runs/${encodeURIComponent(runId)}`, { method: "DELETE", body: "{}" });
  } catch (error) {
    sub.textContent = error.message;
  }
};

modeInput.onchange = updateLiveControl;
amountInput.oninput = updateLiveControl;
updateLiveControl();
</script>
</body>
</html>
